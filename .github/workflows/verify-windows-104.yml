name: Native Windows acceptance evidence
'on':
  push:
    branches:
    - validation/chronicle104-windows-20261004-rivet
    paths:
    - .github/workflows/verify-windows-104.yml
permissions:
  contents: read
concurrency:
  group: chronicle104-native-windows-rivet
  cancel-in-progress: false
jobs:
  native-windows:
    if: github.repository == 'woahwhattheheck/chronicle'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: python
    env:
      CI: 'true'
      CGO_ENABLED: '0'
      SOURCE_SHA: 006bc101c1f2079b04696dfc497f5587328fcc46
      PROBE_COMMIT: 4ca19243e8d0244e76a7d825317e1bce42002adf
      PYTHONIOENCODING: utf-8
    steps:
    - name: Check out exact submitted source
      uses: actions/checkout@v4
      with:
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up repository Go version
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false
    - name: Record native runtime and unchanged acceptance probes
      run: |
        import hashlib, json, os, platform, subprocess, sys
        from pathlib import Path
        from urllib.request import urlopen
        assert sys.platform == "win32", "This job must execute on Windows, not cross-compile"
        evidence = Path("evidence")
        evidence.mkdir()
        head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
        assert head == os.environ["SOURCE_SHA"]
        record = {"source_commit": head, "platform": platform.platform(), "machine": platform.machine(), "python": sys.version, "probe_commit": os.environ["PROBE_COMMIT"]}
        for name, command in {"go-version": ["go", "version"], "go-env": ["go", "env", "-json", "GOOS", "GOARCH", "GOHOSTOS", "GOHOSTARCH", "CGO_ENABLED", "GOVERSION", "GOTOOLCHAIN"], "os-version": ["powershell", "-NoProfile", "-Command", "Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture | ConvertTo-Json"], "source-blobs": ["git", "ls-files", "-s", "disk_usage_windows.go", "health_check.go", "health_check_test.go", "db_test.go", "wal.go", "wal_truncate_windows.go", "wal_truncate_other.go", "wal_reset_windows_test.go", "go.mod", "go.sum"]}.items():
            value = subprocess.check_output(command, text=True)
            (evidence / (name + ".txt")).write_text(value, encoding="utf-8")
            print(name + ":", value)
            if name == "go-env":
                env = json.loads(value)
                assert env["GOOS"] == env["GOHOSTOS"] == "windows"
                assert env["CGO_ENABLED"] == "0"
        url = "https://raw.githubusercontent.com/woahwhattheheck/chronicle/" + os.environ["PROBE_COMMIT"] + "/validation/native_windows_probe_test.go"
        with urlopen(url, timeout=60) as response:
            probe = response.read()
        digest = hashlib.sha256(probe).hexdigest()
        assert digest == "349c75126aecf5a6dd9407bfe8e72be106b6ae214c1cb24979dc75725dbdebbb", "Acceptance probe differs from original failing execution"
        Path("zz_native_windows_acceptance_rivet_test.go").write_bytes(probe)
        (evidence / "native_windows_probe_test.go").write_bytes(probe)
        record["probe_sha256"] = digest
        (evidence / "provenance.json").write_text(json.dumps(record, indent=2), encoding="utf-8")
        print("Unchanged acceptance probe SHA256:", digest)
    - name: Execute existing tests, reset regression and native probes
      run: |
        import json, os, subprocess
        from pathlib import Path
        existing = ["TestHealthCheckEngine", "TestHealthCheckMemoryAndDisk", "TestHealthCheckHTTPEndpoints", "TestDBWriteAndQuery", "TestDBWriteBatch"]
        regression = ["TestWALResetWindowsPreservesAppend"]
        probes = ["TestNativeWindowsDiskUsageAcceptance", "TestNativeWindowsPersistenceAcceptance"]
        names = existing + regression + probes
        command = ["go", "test", "-count=1", "-short", "-p=2", "-timeout=4m", "-json", "-run", "^(" + "|".join(names) + ")$", "."]
        Path("evidence/command.json").write_text(json.dumps(command, indent=2), encoding="utf-8")
        print("Executing:", command, flush=True)
        with open("evidence/go-test.jsonl", "w", encoding="utf-8") as out, open("evidence/go-test-stderr.log", "w", encoding="utf-8") as err:
            result = subprocess.run(command, stdout=out, stderr=err, timeout=720)
        lines = Path("evidence/go-test.jsonl").read_text(encoding="utf-8").splitlines()
        print("\n".join(lines[-45:]), flush=True)
        print(Path("evidence/go-test-stderr.log").read_text(encoding="utf-8"), flush=True)
        Path("evidence/go-test-exit.txt").write_text(str(result.returncode), encoding="utf-8")
        if result.returncode:
            raise SystemExit(result.returncode)
        events = [json.loads(line) for line in lines if line.strip()]
        passed = {e["Test"] for e in events if e.get("Action") == "pass" and "Test" in e}
        assert not any(e.get("Action") == "fail" for e in events) and set(names).issubset(passed), "Missing named pass or unexpected failure"
        assert any(e.get("Action") == "pass" and "Test" not in e for e in events), "Missing terminal package success"
        summary = {"source_commit": os.environ["SOURCE_SHA"], "existing_top_level_tests": existing, "committed_regression_tests": regression, "additive_native_probes": probes, "top_level_passed": len(names), "passed_tests_and_subtests": sorted(passed), "scope": "Native Windows amd64, non-cgo. Actual disk API, focused existing health/write tests, committed WAL reset regression and unchanged close/reopen/path probes. Not the full suite, C FFI, UNC shares, race detector, or maintainer CI."}
        Path("evidence/summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
        print(json.dumps(summary, indent=2), flush=True)
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
            output.write(f"## Native Windows PR104 evidence\n\nEight top-level tests passed at `{os.environ['SOURCE_SHA']}`: five existing tests, the committed WAL reset regression and two unchanged native acceptance probes.\n\n")
            output.write("No checked-out source or existing test was rewritten by the harness. The persistence probe is byte-identical to the first failing run. Scope is non-cgo Windows amd64; full CI, C FFI and UNC shares remain unclaimed.\n")
    - name: Verify tracked source remained unchanged
      if: always()
      run: |
        import subprocess
        from pathlib import Path
        result = subprocess.run(["git", "diff", "--exit-code"], capture_output=True, text=True)
        Path("evidence/source-diff.txt").write_text(result.stdout + result.stderr, encoding="utf-8")
        if result.returncode:
            raise SystemExit(result.returncode)
    - name: Retain execution evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: chronicle104-native-windows-${{ env.SOURCE_SHA }}
        path: evidence/
        retention-days: 14
        if-no-files-found: error
