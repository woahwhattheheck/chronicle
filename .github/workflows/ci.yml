name: Native Windows StreamingSQL registration evidence
'on':
  push:
    branches:
      - validation/chronicle104-ssql-cd79
    paths:
      - .github/workflows/ci.yml
permissions:
  contents: read
concurrency:
  group: chronicle104-ssql-cd79
  cancel-in-progress: false
jobs:
  ssql-before-after:
    if: github.repository == 'woahwhattheheck/chronicle'
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: python
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOPROXY: 'https://proxy.golang.org,direct'
      PYTHONIOENCODING: utf-8
      BASE_SHA: 6be8f377886cfb8a7586c270ab466a52279244c1
      CANDIDATE_SHA: 42c2ecacaf15df14b9c04e1b340627c442a1ea4c
    steps:
      - name: Check out retained baseline
        uses: actions/checkout@v4
        with:
          ref: 6be8f377886cfb8a7586c270ab466a52279244c1
          path: before
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: 42c2ecacaf15df14b9c04e1b340627c442a1ea4c
          path: after
          fetch-depth: 1
          persist-credentials: false
      - name: Set up retained Go version
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
          cache-dependency-path: after/go.sum
      - name: Run focused native before and after
        run: |
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          assert sys.platform == "win32"
          evidence = Path("evidence")
          evidence.mkdir()
          paths = ["streaming_sql.go", "streaming_sql_test.go"]
          before, after = Path("before"), Path("after")
          provenance = {"platform": platform.platform(), "machine": platform.machine(), "before": os.environ["BASE_SHA"], "after": os.environ["CANDIDATE_SHA"]}
          provenance["go_version"] = subprocess.check_output(["go", "version"], text=True).strip()
          provenance["go_env"] = json.loads(subprocess.check_output(["go", "env", "-json", "GOOS", "GOARCH", "GOHOSTOS", "CGO_ENABLED", "GOVERSION", "GOTOOLCHAIN", "GOPROXY"], text=True, cwd=after))
          assert provenance["go_env"]["GOOS"] == provenance["go_env"]["GOHOSTOS"] == "windows"
          assert provenance["go_env"]["CGO_ENABLED"] == "0"
          for label, root, expected in [("before", before, os.environ["BASE_SHA"]), ("after", after, os.environ["CANDIDATE_SHA"])]:
              actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True, cwd=root).strip()
              assert actual == expected
              provenance[label + "_blobs"] = subprocess.check_output(["git", "ls-files", "-s", *paths], text=True, cwd=root)
          formatted = subprocess.check_output(["gofmt", "-l", *paths], text=True, cwd=after)
          assert not formatted.strip(), "Candidate needs gofmt:\n" + formatted
          test_path = paths[-1]
          new_tests = (after / test_path).read_bytes()
          (before / test_path).write_bytes(new_tests)
          provenance["shared_test_sha256"] = hashlib.sha256(new_tests).hexdigest()
          provenance["baseline_test_change"] = subprocess.check_output(["git", "diff", "--name-only"], text=True, cwd=before).splitlines()
          assert provenance["baseline_test_change"] == [test_path]
          assert subprocess.check_output(["git", "diff", "--name-only"], text=True, cwd=after).strip() == ""
          (evidence / "provenance.json").write_text(json.dumps(provenance, indent=2), encoding="utf-8")
          print(json.dumps(provenance, indent=2), flush=True)
          names = ["TestStreamingSQLEngine_MaxConcurrentQueries", "TestStreamingSQLEngine_ListQueries", "TestStreamingSQLEngine_RapidCreatesRetainQueries", "TestStreamingSQLEngine_ConcurrentAdmission"]
          command = ["go", "test", "-short", "-count=1", "-timeout=60s", "-json", "-run", "^(" + "|".join(names) + ")$", "."]
          (evidence / "command.json").write_text(json.dumps(command, indent=2), encoding="utf-8")
          summaries = {}
          for label, root in [("before", before), ("after", after)]:
              print("RUN " + label + ": " + repr(command), flush=True)
              result = subprocess.run(command, capture_output=True, text=True, cwd=root, timeout=360)
              (evidence / (label + ".jsonl")).write_text(result.stdout, encoding="utf-8")
              (evidence / (label + ".stderr.log")).write_text(result.stderr, encoding="utf-8")
              print(result.stdout, flush=True)
              print(result.stderr, flush=True)
              events = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
              passed = {e["Test"] for e in events if e.get("Action") == "pass" and "Test" in e}
              failed = {e["Test"] for e in events if e.get("Action") == "fail" and "Test" in e}
              skipped = {e["Test"] for e in events if e.get("Action") == "skip" and "Test" in e}
              started = {e["Test"] for e in events if e.get("Action") == "run" and "Test" in e}
              package_success = any(e.get("Action") == "pass" and "Test" not in e for e in events)
              summaries[label] = {"exit_code": result.returncode, "passed": sorted(passed), "failed": sorted(failed), "skipped": sorted(skipped), "started": sorted(started), "package_success": package_success}
          (evidence / "summary.json").write_text(json.dumps(summaries, indent=2), encoding="utf-8")
          print("SUMMARY", json.dumps(summaries, indent=2), flush=True)
          assert summaries["before"]["exit_code"] in (0, 1) and set(names).issubset(set(summaries["before"]["started"])), "Baseline did not execute all selected tests"
          # Timestamp collisions and pre-insert interleavings may not occur on every schedule.
          # Retain observed baseline outcomes without fabricating a mandatory failure.
          assert summaries["after"]["exit_code"] == 0 and not summaries["after"]["failed"] and not summaries["after"]["skipped"] and set(names).issubset(set(summaries["after"]["passed"])) and summaries["after"]["package_success"], "Candidate did not pass all selected tests"
          assert subprocess.check_output(["git", "diff", "--name-only"], text=True, cwd=after).strip() == ""
          assert subprocess.check_output(["git", "diff", "--name-only"], text=True, cwd=before).splitlines() == [test_path]
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicle104-ssql-cd79
          path: evidence/
          retention-days: 14
          if-no-files-found: error
