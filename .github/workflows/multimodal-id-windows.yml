name: Multimodal identity on native Windows
on:
  push:
    branches: [validation/chronicle104-multimodal-rivet76f4-20261004]
permissions:
  contents: write
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      PRODUCT_REF: fix/chronicle104-multimodal-rivet76f4-20261004
      SELECTION: '^(TestQueryLogsFullTextSearch|TestQuerySpans|TestMultiModalGeneratedIDUniqueness|TestMultiModalGeneratedIDsRetainRecords)$'
    steps:
      - uses: actions/checkout@v4
        with:
          path: dispatch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: product
          ref: f07e64289e5cc38ad569c108d7b9167beb8f2d97
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: product/go.sum
      - name: Pin source and add the two retained regressions
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = woahwhattheheck/chronicle
          test -z "$(git ls-remote --heads origin "refs/heads/$PRODUCT_REF")"
          mkdir -p evidence
          { git rev-parse HEAD; go version; go env GOOS GOARCH CGO_ENABLED; } | tee evidence/provenance.txt
          git show HEAD:multi_modal_correlate.go > multi_modal_correlate.go
          git show HEAD:multi_modal_correlate_test.go > multi_modal_correlate_test.go
          python -c "from pathlib import Path; p=Path('../dispatch/.github/multimodal-id.patch'); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))"
          test "$(git hash-object multi_modal_correlate.go)" = bfe969740bfb43a676bf138ee40a438d4d01fdef
          test "$(git hash-object multi_modal_correlate_test.go)" = 58222fac0b33e3397954949b0a34f4112d6807bf
          git apply ../dispatch/.github/multimodal-id.patch
          test "$(git hash-object multi_modal_correlate.go)" = 659442b68abcb13e6d5cf0ed21df18e8f996bb57
          test "$(git hash-object multi_modal_correlate_test.go)" = 994ab0171ed4eb58fc2e04f307863cc62212a6fa
          cp multi_modal_correlate.go evidence/fixed.go
          git show HEAD:multi_modal_correlate.go > multi_modal_correlate.go
      - name: Execute the original implementation against the same selection
        working-directory: product
        shell: bash
        run: |
          set -uo pipefail
          go test -short -count=1 -p=2 -timeout=120s -json -run "$SELECTION" . > evidence/before.jsonl 2> evidence/before-stderr.log
          code=$?
          echo "$code" > evidence/before-exit.txt
          cp evidence/fixed.go multi_modal_correlate.go
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(s) for s in Path('evidence/before.jsonl').read_text(encoding='utf-8').splitlines() if s.startswith('{')]
          runs=[r['Test'] for r in rows if r['Action']=='run' and r.get('Test')]
          failures=[r['Test'] for r in rows if r['Action']=='fail' and r.get('Test')]
          assert len(runs)==4, (runs,Path('evidence/before-stderr.log').read_text())
          assert 'TestMultiModalGeneratedIDUniqueness' in failures, failures
          print(json.dumps({'executed':runs,'failed':failures}))
          PY
      - name: Execute the repaired implementation without changing dependencies
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object multi_modal_correlate.go)" = 659442b68abcb13e6d5cf0ed21df18e8f996bb57
          go test -short -count=1 -p=2 -timeout=120s -json -run "$SELECTION" . > evidence/after.jsonl 2> evidence/after-stderr.log
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(s) for s in Path('evidence/after.jsonl').read_text(encoding='utf-8').splitlines() if s.startswith('{')]
          passed=[r['Test'] for r in rows if r['Action']=='pass' and r.get('Test')]
          assert len(passed)==4, passed
          assert not any(r['Action'] in ('fail','skip') for r in rows)
          print(json.dumps({'passed':passed,'failed':0,'skipped':0}))
          PY
          git diff --exit-code -- go.mod go.sum multi_modal.go multi_modal_test.go
      - name: Preserve the two-file source-only candidate
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git add multi_modal_correlate.go multi_modal_correlate_test.go
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(multimodal): prevent generated log and span ID collisions [skip ci]' -m 'Use one process-monotonic atomic allocator while preserving 16-character hexadecimal IDs and explicit producer identities. Coarse clock readings can no longer overwrite spans or join unrelated log-index entries.' -m "Native Windows Go1.24.13, CGO0: original generated-ID uniqueness regression fails; all four selected original/regression tests pass after repair. No full suite or race-detector claim. Run https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$PRODUCT_REF"
          git rev-parse HEAD | tee evidence/candidate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronicle104-multimodal-native-result
          path: product/evidence
          retention-days: 7
