name: Native Windows digitaltwin cleanup
'on':
  push:
    branches: [validation/chronicle104-digitaltwin-759b]
    paths: [.github/workflows/verify-digitaltwin-759b.yml]
permissions:
  contents: write
concurrency:
  group: chronicle104-digitaltwin-759b
  cancel-in-progress: false
jobs:
  native-windows:
    if: github.repository == 'woahwhattheheck/chronicle'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: python
    env:
      CGO_ENABLED: '0'
      PYTHONIOENCODING: utf-8
      SOURCE_SHA: d6e5f9144e9a376a3dee2ca3327617c8012fa84b
      RESULT_REF: validation/chronicle104-digitaltwin-result-759b
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: 1
        persist-credentials: true
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true
    - name: Reproduce, close owned fixture databases, and execute the same tests
      run: |
        import hashlib, json, os, platform, subprocess, sys
        from pathlib import Path
        assert sys.platform == 'win32'
        evidence = Path('evidence')
        evidence.mkdir()
        source = os.environ['SOURCE_SHA']
        assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
        file = 'internal/digitaltwin/test_test.go'
        original = subprocess.check_output(['git', 'show', 'HEAD:' + file])
        def blob(data):
            return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
        assert blob(original) == 'fb7988a1af936592608420f6abde4a5d726603ef'
        names = ['TestDigitalTwinEngine', 'TestAddConnection', 'TestRemoveConnection', 'TestAddMapping', 'TestMappingWithInvalidConnection', 'TestRemoveMapping', 'TestPushMetric', 'TestPushMetricWithTransform', 'TestTwinCallbacks', 'TestPlatformCreation']
        command = ['go', 'test', '-short', '-count=1', '-p=2', '-timeout=120s', '-json', '-run', '^(' + '|'.join(names) + ')$', './internal/digitaltwin']
        info = {'source_commit': source, 'source_blob': blob(original), 'platform': platform.platform(), 'python': sys.version, 'go': subprocess.check_output(['go', 'version'], text=True).strip(), 'command': command, 'selected_tests': names}
        (evidence / 'provenance.json').write_text(json.dumps(info, indent=2), encoding='utf-8')
        def execute(label):
            with (evidence / (label + '.jsonl')).open('w', encoding='utf-8') as out, (evidence / (label + '.stderr')).open('w', encoding='utf-8') as err:
                result = subprocess.run(command, stdout=out, stderr=err, timeout=600)
            lines = (evidence / (label + '.jsonl')).read_text(encoding='utf-8').splitlines()
            events = [json.loads(line) for line in lines if line.strip()]
            print(label, 'exit', result.returncode, flush=True)
            print('\n'.join(lines[-35:]), flush=True)
            print((evidence / (label + '.stderr')).read_text(encoding='utf-8'), flush=True)
            (evidence / (label + '.exit')).write_text(str(result.returncode), encoding='utf-8')
            return result.returncode, events
        before, baseline = execute('before')
        failed = {e['Test'] for e in baseline if e.get('Action') == 'fail' and 'Test' in e and '/' not in e['Test']}
        assert before == 1 and failed == set(names), 'Baseline does not reproduce the ten retained failures'
        needle = b'\tif err != nil {\n\t\tt.Fatalf("failed to open test db: %v", err)\n\t}\n\treturn db\n'
        replacement = needle.replace(b'\treturn db\n', b'\tt.Cleanup(func() {\n\t\tif err := db.Close(); err != nil {\n\t\t\tt.Errorf("failed to close test db: %v", err)\n\t\t}\n\t})\n\treturn db\n')
        assert original.count(needle) == 1
        candidate = original.replace(needle, replacement)
        Path(file).write_bytes(candidate)
        assert not subprocess.check_output(['gofmt', '-d', file]), 'Unexpected formatting delta'
        after, repaired = execute('after')
        passed = {e['Test'] for e in repaired if e.get('Action') == 'pass' and 'Test' in e}
        assert after == 0 and set(names).issubset(passed) and not any(e.get('Action') == 'fail' for e in repaired)
        assert any(e.get('Action') == 'pass' and 'Test' not in e for e in repaired)
        diff = subprocess.check_output(['git', 'diff', '--', file], text=True)
        (evidence / 'source.diff').write_text(diff, encoding='utf-8')
        assert subprocess.check_output(['git', 'diff', '--name-only'], text=True).strip() == file
        info.update({'candidate_blob': blob(candidate), 'before_exit': before, 'before_failed_top_level': sorted(failed), 'after_exit': after, 'after_passed_test_events': sorted(passed), 'scope': 'Ten existing Windows digitaltwin cases only; no product source or assertion change, no full-suite, upstream acceptance or payment claim.'})
        (evidence / 'summary.json').write_text(json.dumps(info, indent=2), encoding='utf-8')
        print(json.dumps(info, indent=2), flush=True)
    - name: Retain the tested code-only commit on a new result branch
      run: |
        import json, os, subprocess
        from pathlib import Path
        source = os.environ['SOURCE_SHA']
        assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
        subprocess.run(['git', 'add', '--', 'internal/digitaltwin/test_test.go'], check=True)
        assert subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).strip() == 'internal/digitaltwin/test_test.go'
        subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'test: close digitaltwin fixture databases before directory cleanup'], check=True)
        commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
        assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == source
        subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + os.environ['RESULT_REF']], check=True)
        summary = json.loads(Path('evidence/summary.json').read_text(encoding='utf-8'))
        summary.update({'tested_commit': commit, 'result_ref': os.environ['RESULT_REF']})
        Path('evidence/summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
        print('TESTED_RESULT_COMMIT=' + commit, flush=True)
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
            out.write('Ten existing Windows cases: baseline fails ten; five-line cleanup passes ten. Tested code-only commit: `' + commit + '`. Original PR branch is unchanged.\n')
    - name: Retain scoped native evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: chronicle104-digitaltwin-759b
        path: evidence/
        retention-days: 14
        if-no-files-found: error
