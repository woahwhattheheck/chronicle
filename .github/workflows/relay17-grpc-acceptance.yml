name: Chronicle104 retained gRPC failure inspection Relay17

on:
  push:
    branches: [validation/chronicle104-grpc-relay17-20261004]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chronicle104-grpc-relay17
          run-id: 37202462701
          github-token: ${{ github.token }}
          path: grpc-retained
      - name: Read existing failed-case output without executing tests
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("grpc-retained")
          for label in ("baseline", "candidate"):
              rows = [json.loads(line) for line in (root / (label + ".jsonl")).read_text(encoding="utf-8").splitlines() if line.strip()]
              failed = {row["Test"] for row in rows if row.get("Action") == "fail" and row.get("Test")}
              print("RETAINED " + label)
              for row in rows:
                  if row.get("Action") == "output" and row.get("Test") in failed:
                      print(json.dumps({"test": row["Test"], "output": row["Output"]}), flush=True)
          PY
