name: Chronicle104 gRPC aggregation acceptance Relay17

on:
  push:
    branches: [validation/chronicle104-grpc-relay17-20261004]

permissions:
  contents: read

jobs:
  grpc:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - name: Run the final candidate and maintained index coverage
        shell: pwsh
        run: python work/validation/chronicle104-grpc-relay17/run_final.py
      - name: Retain exact source and raw execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicle104-grpc-relay17-final
          path: grpc-final-evidence/
          retention-days: 14
