name: NOT IN lookup current-head validation
on:
  push:
    branches:
      - gf-payload/notin-lookup-20261004
permissions:
  contents: read
concurrency:
  group: notin-lookup-current-head
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol56/chronicle103-notin-lookup-20261004
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - name: Verify source pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "502c8e54b085897761b38f83c4b8b64eea3da873"
          test -z "$(gofmt -l query.go tags.go partition_query.go tag_not_in_lookup_test.go)"
      - name: Focused correctness
        run: |
          set -euo pipefail
          go test -count=1 -run '^(TestNotInLookup|TestTagOpNotIn|TestParseNotIn|TestTagMembershipPresence|TestPredicatePushDown)' .
          go test -count=1 ./internal/query/
      - name: Focused performance
        run: |
          set -euo pipefail
          go test -run '^$' -bench '^BenchmarkNotIn(Lookup4096|PrepareAndMatch4096)$' -benchmem -benchtime=300ms -count=3 .
