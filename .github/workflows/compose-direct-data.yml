name: Exercise direct stored-data Grafana panel
on:
  push:
    branches: [validation/compose-direct-data-20261005-peregrine]
permissions:
  contents: read
concurrency:
  group: chronicle106-direct-data-peregrine
  cancel-in-progress: false
jobs:
  direct-data:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 27613bcbfb086fd990879c225079fee46b898532
          fetch-depth: 2
          persist-credentials: false
      - name: Start the maintained Compose stack
        working-directory: examples/docker-compose-monitoring
        run: |
          mkdir -p /tmp/chronicle106-direct-data
          git rev-parse HEAD > /tmp/chronicle106-direct-data/source.txt
          docker compose version > /tmp/chronicle106-direct-data/compose-version.txt
          set -o pipefail
          docker compose up --build -d 2>&1 | tee /tmp/chronicle106-direct-data/start.log
      - name: Query native and provisioned stored-data paths
        run: |
          python - <<'PY'
          import base64
          from http.client import HTTPException
          import json
          import math
          from pathlib import Path
          import time
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          out = Path('/tmp/chronicle106-direct-data')
          base = 'http://127.0.0.1:3000'
          headers = {'Authorization': 'Basic ' + base64.b64encode(b'admin:chronicle').decode()}
          selector = 'demo_cpu_percent{host="compose",env="dev"}'

          def request(path, body=None):
              h = dict(headers)
              if body is not None:
                  h.update({'Content-Type': 'application/json', 'Origin': base})
              req = Request(base + path, headers=h, data=None if body is None else json.dumps(body).encode())
              with urlopen(req, timeout=15) as response:
                  return json.load(response)

          def save(name, value):
              (out / name).write_text(json.dumps(value, indent=2) + '\n')

          def native(path):
              with urlopen('http://127.0.0.1:8086' + path, timeout=15) as response:
                  return json.load(response)

          for attempt in range(60):
              try:
                  health = request('/api/health')
                  if health.get('database') == 'ok':
                      break
              except (OSError, HTTPException):
                  pass
              time.sleep(2)
          else:
              raise RuntimeError('Grafana did not become ready')
          save('grafana-health.json', health)
          source = request('/api/datasources/uid/Chronicle')
          save('datasource.json', source)
          assert source['type'] == 'prometheus' and source['url'] == 'http://chronicle:8086'
          assert source['jsonData']['httpMethod'] == 'GET'
          dashboard = request('/api/dashboards/uid/chronicle-compose-overview')
          save('dashboard.json', dashboard)
          panels = dashboard['dashboard']['panels']
          panel = next(p for p in panels if p.get('id') == 3)
          assert panel['datasource']['uid'] == 'Chronicle'
          assert panel['targets'][0]['expr'] == selector
          assert [p['datasource']['uid'] for p in panels[:2]] == ['Prometheus', 'Prometheus']

          # Establish actual ingestion before comparing the three query paths.
          for attempt in range(12):
              instant = native('/api/v1/query?' + urlencode({'query': selector}))
              save('native-instant-response.json', instant)
              if instant.get('data', {}).get('result'):
                  break
              time.sleep(5)
          now = int(time.time())
          params = {'query': selector, 'start': now - 300, 'end': now, 'step': 5}
          route = '/api/v1/query_range?' + urlencode(params)
          save('native-range-request.json', params)
          direct = native(route)
          save('native-range-response.json', direct)
          proxy = request('/api/datasources/proxy/uid/Chronicle' + route)
          save('proxy-range-response.json', proxy)

          query = {
              'queries': [{**panel['targets'][0], 'datasource': panel['datasource'],
                           'format': 'time_series', 'intervalMs': 5000, 'maxDataPoints': 1000}],
              'from': str((now - 300) * 1000), 'to': str(now * 1000),
          }
          save('backend-query-request.json', query)
          try:
              result = request('/api/ds/query', query)
          except HTTPError as error:
              save('backend-http-error.json', {'status': error.code, 'body': error.read().decode('utf-8', 'replace')})
              raise
          save('backend-query-response.json', result)
          item = result.get('results', {}).get('A', {})
          readings = []
          for frame in item.get('frames', []):
              for field, values in zip(frame.get('schema', {}).get('fields', []), frame.get('data', {}).get('values', [])):
                  if field.get('type') == 'number' and field.get('labels', {}).get('host') == 'compose':
                      readings.extend(v for v in values if isinstance(v, (int, float)) and not isinstance(v, bool) and math.isfinite(v))
          summary = {
              'source_sha': '27613bcbfb086fd990879c225079fee46b898532',
              'grafana_version': health.get('version'), 'datasource_uid': source['uid'],
              'stored_selector': selector,
              'native_instant_series': len(instant.get('data', {}).get('result', [])),
              'native_range_series': len(direct.get('data', {}).get('result', [])),
              'proxy_range_series': len(proxy.get('data', {}).get('result', [])),
              'backend_finite_samples': len(readings),
              'backend_value_min': min(readings) if readings else None,
              'backend_value_max': max(readings) if readings else None,
              'scope': 'Real maintained containers, provisioned dashboard, native queries, datasource proxy and backend query. No browser rendering, full regression suite, external notification or payment claim.',
          }
          save('result.json', summary)
          print(json.dumps(summary, indent=2))
          assert direct.get('status') == 'success' and summary['native_range_series'] > 0, 'No native stored range data'
          assert proxy.get('status') == 'success' and summary['proxy_range_series'] > 0, 'No proxy range data'
          assert not item.get('error') and item.get('status', 200) < 400, 'Backend query error'
          assert readings and all(20 <= value <= 34 for value in readings), 'No valid stored samples in Grafana backend frames'
          PY
      - name: Run the focused interval regression against original and repaired source
        run: |
          set -o pipefail
          git show 3ec9685653eef096c1af075fecc12982cda77ce6:index.go > /tmp/chronicle106-direct-data/index-before.go
          git diff HEAD^ HEAD -- index.go index_overlap_test.go > /tmp/chronicle106-direct-data/repair.patch
          docker build --target builder -t chronicle-query-regression -f examples/docker-compose-monitoring/Dockerfile . > /tmp/chronicle106-direct-data/regression-build.log 2>&1
          docker run --rm -v /tmp/chronicle106-direct-data:/evidence chronicle-query-regression sh -ec '
            apk add --no-cache build-base > /evidence/build-toolchain.log
            test -z "$(gofmt -l index.go index_overlap_test.go)"
            go version > /evidence/go-version.txt
            cp index.go /tmp/index-fixed.go
            cp /evidence/index-before.go index.go
            set +e
            CGO_ENABLED=1 go test -p 2 -run "^TestIndexFindPartitionsOverlappingWindow$" -count=1 -v . > /evidence/regression-before.log 2>&1
            before=$?
            set -e
            if [ "$before" -ne 1 ] || ! grep -Fq -- "--- FAIL: TestIndexFindPartitionsOverlappingWindow" /evidence/regression-before.log; then
              cat /evidence/regression-before.log
              echo "Original source did not exhibit the expected executed regression failure"
              exit 1
            fi
            cp /tmp/index-fixed.go index.go
            CGO_ENABLED=1 go test -p 2 -run "^TestIndexFindPartitionsOverlappingWindow$" -count=1 -v . > /evidence/regression-after.log 2>&1
            cat /evidence/regression-after.log
          '
      - name: Preserve runtime diagnostics and stop this stack
        if: always()
        working-directory: examples/docker-compose-monitoring
        run: |
          mkdir -p /tmp/chronicle106-direct-data
          docker compose ps --format json > /tmp/chronicle106-direct-data/services.json
          docker compose images --format json > /tmp/chronicle106-direct-data/images.json
          docker compose logs --no-color --tail 100 > /tmp/chronicle106-direct-data/services.log 2>&1
          git diff --exit-code > /tmp/chronicle106-direct-data/tracked-source.diff
          docker compose down
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chronicle106-direct-data-${{ github.run_id }}
          path: /tmp/chronicle106-direct-data/
          retention-days: 14
