apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-with-chronicle
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        chronicle.io/scrape: "true"
        chronicle.io/port: "9090"
        chronicle.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        # Both containers use the example binary, running separate components.
        # Build and load this image before applying the manifests (see README).
        - name: demo-app
          image: chronicle-kubernetes-sidecar:local
          imagePullPolicy: IfNotPresent
          args:
            - -mode=app
            - -metrics-port=$(metrics_port)
            - -metrics-path=$(metrics_path)
          envFrom:
            - configMapRef:
                name: chronicle-sidecar-config
          ports:
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: chronicle-sidecar
          image: chronicle-kubernetes-sidecar:local
          imagePullPolicy: IfNotPresent
          args:
            - -mode=sidecar
            - -http-bind-address=0.0.0.0
            - -data-dir=/data
            - -metrics-port=$(metrics_port)
            - -metrics-path=$(metrics_path)
            - -scrape-interval=$(scrape_interval)
            - -scrape-timeout=$(scrape_timeout)
            - -health-port=$(health_port)
            - -retention=$(retention)
          envFrom:
            - configMapRef:
                name: chronicle-sidecar-config
          ports:
            - name: health
              containerPort: 8080
            - name: http
              containerPort: 8086
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: chronicle-data
              mountPath: /data
            - name: podinfo
              mountPath: /etc/podinfo
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: chronicle-data
          emptyDir:
            sizeLimit: 256Mi
        - name: podinfo
          downwardAPI:
            items:
              - path: labels
                fieldRef:
                  fieldPath: metadata.labels
              - path: annotations
                fieldRef:
                  fieldPath: metadata.annotations
