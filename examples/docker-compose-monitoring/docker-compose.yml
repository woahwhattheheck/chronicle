services:
  chronicle:
    build:
      context: ../..
      dockerfile: examples/docker-compose-monitoring/Dockerfile
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - chronicle-data:/data
    healthcheck:
      test: ["CMD", "/chronicle-compose", "health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      chronicle:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: chronicle
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - chronicle

  # Writes sample points so the scrape's metric-count gauge becomes nonzero.
  metric-gen:
    image: public.ecr.aws/docker/library/busybox:1.36
    depends_on:
      chronicle:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        while true; do
          i=$$((i+1))
          val=$$((20 + i % 15))
          wget -qO- --post-data="demo_cpu_percent,host=compose,env=dev value=$$val" \
            http://chronicle:8086/write || true
          sleep 5
        done

volumes:
  chronicle-data:
  prometheus-data:
  grafana-data:
