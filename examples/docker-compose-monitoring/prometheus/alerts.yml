groups:
  - name: chronicle-stack
    rules:
      - alert: ChronicleTargetDown
        expr: up{job="chronicle"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Chronicle scrape target is down"
          description: "Prometheus cannot scrape Chronicle at {{ $labels.instance }}."

      - alert: ChronicleNoSampleData
        expr: chronicle_metric_count{job="chronicle"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "No sample metrics have been ingested"
          description: "The example generator has not written a Chronicle metric."
