groups:
  - name: chronicle-stack
    rules:
      - alert: ChronicleTargetDown
        expr: up{job="chronicle"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Chronicle scrape target is down"
          description: "Prometheus cannot scrape Chronicle at {{ $labels.instance }}."

      - alert: ChronicleHighScrapeFailures
        expr: increase(chronicle_sidecar_scrape_errors[5m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated Chronicle scrape errors"
          description: "Scrape errors increased by {{ $value }} over 5m."
