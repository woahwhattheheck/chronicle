global:
  resolve_timeout: 5m

route:
  receiver: local-ui
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 2h

# Alerts remain visible in Alertmanager's UI. Add a receiver before expecting
# external notifications; the example does not point to a nonexistent webhook.
receivers:
  - name: local-ui
